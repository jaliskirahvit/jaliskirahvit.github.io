name: Instagram token refresh and check

# Instagram long-lived tokens expire after 60 days unless refreshed.
# Needs the secret SECRETS_PAT: a fine-grained token for this repository
# with the permission "Secrets: Read and write". See story/README.md.

on:
    schedule:
        - cron: '17 3 * * 1'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    refresh:
        runs-on: ubuntu-latest
        steps:
            - name: Refresh token
              env:
                IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
                GH_TOKEN: ${{ secrets.SECRETS_PAT }}
                IG_API_HOST: ${{ vars.IG_API_HOST }}
                IG_USER_ID: ${{ secrets.IG_USER_ID }}
              run: |
                # Facebook Login Page tokens do not expire, but Meta's data access
                # does after ~90 days without re-authorisation. Fail loudly then,
                # so the failed run notifies before a match story is lost.
                if [ "$IG_API_HOST" = "graph.facebook.com" ]; then
                  response=$(curl -sS -G "https://graph.facebook.com/v23.0/$IG_USER_ID" \
                    --data-urlencode "fields=username" \
                    --data-urlencode "access_token=$IG_ACCESS_TOKEN")
                  if [ "$(echo "$response" | jq -r '.username // empty')" = "" ]; then
                    echo "Token check failed: $response"
                    echo "Re-authorise the app in Graph API Explorer and update IG_ACCESS_TOKEN (story/README.md)"
                    exit 1
                  fi
                  echo "Facebook Login token works for @$(echo "$response" | jq -r .username)"
                  exit 0
                fi
                if [ -z "$IG_ACCESS_TOKEN" ] || [ -z "$GH_TOKEN" ]; then
                  echo "IG_ACCESS_TOKEN or SECRETS_PAT missing, nothing to do"
                  exit 0
                fi
                response=$(curl -sS --fail-with-body -G "https://graph.instagram.com/refresh_access_token" \
                  --data-urlencode "grant_type=ig_refresh_token" \
                  --data-urlencode "access_token=$IG_ACCESS_TOKEN")
                token=$(echo "$response" | jq -r '.access_token // empty')
                if [ -z "$token" ]; then
                  echo "Refresh failed: $(echo "$response" | jq -c 'del(.access_token)')"
                  exit 1
                fi
                echo "::add-mask::$token"
                gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" --body "$token"
                echo "Token refreshed, valid for $(echo "$response" | jq -r '.expires_in') more seconds"
